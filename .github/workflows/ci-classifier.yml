name: CI Classifier

# So dispara em mudanca do FastAPI/modelo. Independente do backend.
on:
  push:
    branches: [main]
    paths:
      - "apps/classifier/**"
      - ".github/workflows/ci-classifier.yml"
  pull_request:
    paths:
      - "apps/classifier/**"
      - ".github/workflows/ci-classifier.yml"

env:
  IMAGE: ghcr.io/${{ github.repository }}/classifier

concurrency:
  group: ci-classifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s apps/classifier -p 'test_*.py'
      - run: python -m compileall -q apps/classifier

  publish:
    needs: test
    name: Build, Validate & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/classifier/Dockerfile
          # Em PR so construimos (valida o Dockerfile); push so em main.
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Sem cache, cada build reinstala ~250MB de tensorflow-cpu.
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:cache,mode=max', env.IMAGE) || '' }}

      - name: Validate real model and HTTP contract
        run: docker run --rm -v "$PWD/apps/classifier/smoke_test.py:/app/smoke_test.py:ro" "${{ env.IMAGE }}:${{ github.sha }}" python smoke_test.py

      - name: Push validated image
        if: github.event_name == 'push'
        run: docker push "${{ env.IMAGE }}:${{ github.sha }}"
