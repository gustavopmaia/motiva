name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GIT_TOKEN,REPO
          script: |
            cd ${{ vars.EC2_APP_PATH }}
            git pull https://x-access-token:$GITHUB_TOKEN@github.com/$REPO.git main
            docker compose up -d --build
            docker image prune -f
