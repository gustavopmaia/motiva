name: CI / Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-cd.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/backend/**"
      - "packages/**"
      - "Dockerfile"
      - "docker-compose.yml"

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: "npm"

      - run: npm ci

      - run: npm test --workspace=backend

  publish:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,GHCR_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            cd ${{ vars.EC2_APP_PATH }}
            echo $GHCR_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            BACKEND_IMAGE=$(echo $IMAGE | tr '[:upper:]' '[:lower:]'):latest
            export BACKEND_IMAGE
            docker compose pull backend
            docker compose run --rm --no-deps backend npm run --workspace backend migrate
            docker compose up -d --force-recreate --remove-orphans backend
            docker image prune -f
