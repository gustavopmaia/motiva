name: CI / Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-cd.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/backend/**"
      - "packages/**"
      - "Dockerfile"
      - "docker-compose.yml"

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=backend

      - name: Test
        run: npm test --workspace=backend

  deploy:
    name: Deploy
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GIT_SECRET: ${{ secrets.GIT_SECRET }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GIT_SECRET,REPO
          script: |
            set -e
            cd ${{ vars.EC2_APP_PATH }}
            git pull --ff-only https://x-access-token:$GIT_SECRET@github.com/$REPO.git main

            docker compose build backend
            docker compose run --rm --no-deps backend npm run --workspace backend migrate
            docker compose up -d --force-recreate --remove-orphans backend
            docker image prune -f
