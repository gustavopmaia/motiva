name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "Dockerfile"
      - "docker-compose.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GIT_SECRET: ${{ secrets.GIT_SECRET }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GIT_SECRET,REPO
          script: |
            cd ${{ vars.EC2_APP_PATH }}
            git pull https://x-access-token:$GIT_SECRET@github.com/$REPO.git main

            docker compose --profile generate run --rm generator

            git add apps/backend/drizzle/
            if ! git diff --staged --quiet; then
              git config user.email "deploy@motiva.nyxdev.com"
              git config user.name "Deploy CI/CD"
              git commit -m "chore: generate migrations [skip ci]"
              git push https://x-access-token:$GIT_SECRET@github.com/$REPO.git main
            fi

            docker compose build
            docker compose --profile migrate run --rm migrator
            docker compose up -d
            docker image prune -f
