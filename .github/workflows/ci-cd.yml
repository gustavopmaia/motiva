name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-cd.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/backend/**"
      - "packages/**"
      - "Dockerfile"
      - "docker-compose.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GIT_SECRET: ${{ secrets.GIT_SECRET }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GIT_SECRET,REPO
          script: |
            set -e
            cd ${{ vars.EC2_APP_PATH }}
            git pull --ff-only https://x-access-token:$GIT_SECRET@github.com/$REPO.git main

            docker compose build backend
            docker compose run --rm --no-deps backend npm run --workspace backend migrate
            docker compose up -d --force-recreate --remove-orphans backend
            docker image prune -f
