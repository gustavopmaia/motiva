app = 'motiva-backend'
primary_region = 'gru'

[build]
  dockerfile = '../../Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[checks]
  [checks.health]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    port = 3000
    timeout = '5s'
    type = 'http'

[[vm]]
  memory = '512mb'
  cpus = 1
