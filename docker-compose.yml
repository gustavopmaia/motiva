services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/gustavopmaia/motiva/backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ./apps/backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - vehicle-captures-data:/data/vehicle-captures
    ports:
      - "0.0.0.0:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5
    container_name: backend-postgres
    env_file: ./apps/backend/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: backend-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  docs:
    image: ${DOCS_IMAGE:-ghcr.io/gustavopmaia/motiva/docs:latest}
    build:
      context: .
      dockerfile: docs/Dockerfile
    ports:
      - "0.0.0.0:3001:3001"
    restart: unless-stopped

volumes:
  postgres-data:
  vehicle-captures-data:
